<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HandSync · Permisos</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #FFF7ED; color: #166534;
           display: flex; justify-content: center; padding: 48px 16px; margin: 0; }
    main { max-width: 480px; background: #F0FDF4; border: 2px solid #15803D;
           border-radius: 16px; padding: 28px; }
    h1 { margin-top: 0; color: #EA580C; }
    button { background: #166534; color: #fff; border: 0; border-radius: 10px;
             padding: 12px 20px; font-size: 1.05rem; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #EA580C; outline-offset: 3px; }
    #estado { margin-top: 18px; font-weight: 600; }
    .error { color: #9A3412; }
  </style>
</head>
<body>
  <main>
    <h1>Permisos de HandSync</h1>
    <p>HandSync necesita tu <strong>cámara</strong> (para reconocer señas) y tu
       <strong>micrófono</strong> (para transcribir voz). Todo se procesa en tu computador.</p>
    <button id="btn-permitir" aria-label="Permitir acceso a cámara y micrófono">Permitir cámara y micrófono</button>
    <p id="estado" role="status" aria-live="polite"></p>
  </main>
  <script src="permisos.js"></script>
</body>
</html>
